<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Inscription confirmée : masterclass du 17 septembre | ÉLAN</title>
<meta content="Votre inscription à la masterclass du 17 septembre est enregistrée." name="description"/>
<meta name="robots" content="noindex"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@500;600&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#241b18;
  --muted:#70635d;
  --paper:#fbf7f2;
  --paper2:#fffdf9;
  --accent:#d96543;
  --accent-dark:#b94d30;
  --soft:#f3d7cb;
  --line:#dfd2c8;
  --card:#fffdf9;
  --max:1160px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",Arial,sans-serif;line-height:1.55}
.wrap{width:min(calc(100% - 40px),var(--max));margin:auto}
header{padding:26px 0;border-bottom:1px solid var(--line);background:rgba(246,241,232,.96)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{font-weight:700;text-decoration:none}
.elan-word{font-family:"Playfair Display",Georgia,serif;font-size:35px;line-height:1;font-weight:600;font-style:italic;letter-spacing:-.045em;color:var(--accent)}
.by-marie{display:block;font-size:12px;line-height:1;font-weight:500;letter-spacing:.28em;color:#9b8779;margin-top:6px}
main{padding:70px 0 90px}
.confirm-card{max-width:620px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:48px clamp(24px,5vw,56px);text-align:center}
.check{width:56px;height:56px;margin:0 auto 22px}
h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(28px,4vw,36px);font-weight:600;margin:0 0 18px;line-height:1.2}
.lead{font-size:17px;color:var(--ink);margin:0 0 14px}
.muted{font-size:15px;color:var(--muted);margin:0 0 30px}
.date-bar{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:10px 20px;font-size:14px;font-weight:600;margin:0 0 30px}
.date-bar .sep{color:var(--soft)}
.date-bar .free{color:var(--accent-dark);font-weight:700}
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fffaf6!important;text-decoration:none;border-radius:999px;font-weight:700;padding:15px 26px;font-size:15px;transition:.2s ease}
.button:hover{background:var(--accent-dark)}
footer{padding:30px 0;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--muted)}
footer a{color:inherit}
</style>
</head>
<body>
<header>
<div class="wrap nav">
<a aria-label="ÉLAN by Marie Bras" class="brand" href="https://mariebras.fr">
<span class="elan-word">ÉLAN</span>
<span class="by-marie">by Marie Bras</span>
</a>
</div>
</header>
<main>
<div class="wrap">
<div class="confirm-card">
<svg class="check" viewBox="0 0 56 56" fill="none">
<circle cx="28" cy="28" r="28" fill="#1f5c3a"/>
<path d="M16 29l8 8 16-16" stroke="#e8f6ee" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<h1>C'est noté, votre place est réservée.</h1>
<p class="lead">Votre inscription à la masterclass est enregistrée.</p>
<p class="muted">Vous recevrez les informations de connexion avant le 17 septembre.</p>
<div class="date-bar">
<span>Jeudi 17 septembre</span><span class="sep">·</span><span>12h00</span><span class="sep">·</span><span>En ligne</span><span class="free">Gratuit</span>
</div>
<div>
<a class="button" href="https://mariebras.fr">Retour au site</a>
</div>
</div>
</div>
</main>
<footer>
<div class="wrap">ÉLAN by Marie Bras · <a href="https://mariebras.fr">mariebras.fr</a></div>
</footer>
</body>
</html>
